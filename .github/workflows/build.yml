name: Build C001APK Unsigned IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode (iOS 27 / macOS 26 SDK)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Sync Version from Git Tag (if tagged release)
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            CLEAN_VER="${RAW_TAG#[vV]}"
            echo "Detected release tag: $RAW_TAG -> Marketing Version: $CLEAN_VER"
            sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $CLEAN_VER/g" project.yml
          fi

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run CoolapkKit Unit Tests
        run: |
          cd Packages/CoolapkKit
          swift test --parallel

      - name: Build Release App (Unsigned iOS Device Binary)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project C001APK.xcodeproj \
            -scheme C001APK \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package Unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -name "C001APK.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::C001APK.app not found in build products!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"

          STAGE_DIR="$RUNNER_TEMP/ipa_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/C001APK.app"

          # Strip any residual signature metadata for clean TrollStore / AltStore / SideStore / Sideloadly sideloading
          rm -rf "$STAGE_DIR/Payload/C001APK.app/_CodeSignature"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_LABEL="${{ github.ref_name }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION_LABEL="${{ github.ref_name }}-${SHORT_SHA}"
          fi
          IPA_NAME="Swift-C001APK-${VERSION_LABEL}-unsigned.ipa"
          cd "$STAGE_DIR"
          zip -qry "$GITHUB_WORKSPACE/dist/$IPA_NAME" Payload

          # Also create a stable filename copy for quick links
          cp "$GITHUB_WORKSPACE/dist/$IPA_NAME" "$GITHUB_WORKSPACE/dist/Swift-C001APK-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/dist/$IPA_NAME" > "$GITHUB_WORKSPACE/dist/$IPA_NAME.sha256"
          shasum -a 256 "$GITHUB_WORKSPACE/dist/Swift-C001APK-unsigned.ipa" > "$GITHUB_WORKSPACE/dist/Swift-C001APK-unsigned.ipa.sha256"

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swift-C001APK-unsigned-ipa
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          name: "Swift C001APK (S001) ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body: |
            ## Swift C001APK（S001）${{ github.ref_name }}

            > **iOS 端最好的酷安第三方客户端，没有之一**

            ### 📦 安装包下载与加速镜像
            - **直接下载（指定版本）**：[`${{ env.IPA_NAME }}`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.IPA_NAME }})
            - **直接下载（固定文件名）**：[`Swift-C001APK-unsigned.ipa`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Swift-C001APK-unsigned.ipa)
            - **🚀 GitHub 代理加速下载（ghproxy）**：
              - `https://mirror.ghproxy.com/https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.IPA_NAME }}`
              - `https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Swift-C001APK-unsigned.ipa`

            ### 🔧 安装方式
            - **TrollStore（巨魔商店）**：下载 `.ipa` 后直接分享至 TrollStore 永久安装。
            - **AltStore / SideStore / Sideloadly / 轻松签（ESign）**：导入 `.ipa` 并使用个人 Apple ID 或企业证书签名安装。
          files: |
            dist/${{ env.IPA_NAME }}
            dist/${{ env.IPA_NAME }}.sha256
            dist/Swift-C001APK-unsigned.ipa
            dist/Swift-C001APK-unsigned.ipa.sha256
