name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run CoolapkKit unit tests
        run: swift test --package-path Packages/CoolapkKit

      - name: Install XcodeGen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app (arm64)
        run: |
          xcodebuild build \
            -project C001APK.xcodeproj \
            -scheme C001APK \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA and verify binary
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/C001APK.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          file "$APP_PATH/C001APK" | grep -q "arm64"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../C001APK-iOS27-unsigned.ipa Payload)
          shasum -a 256 build/C001APK-iOS27-unsigned.ipa > build/C001APK-iOS27-unsigned.ipa.sha256
          cat build/C001APK-iOS27-unsigned.ipa.sha256

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: C001APK-iOS27-unsigned-ipa
          path: |
            build/C001APK-iOS27-unsigned.ipa
            build/C001APK-iOS27-unsigned.ipa.sha256
          retention-days: 14
